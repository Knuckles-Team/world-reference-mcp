[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world-reference-mcp"
version = "0.3.6"
description = "World-reference data (taxonomy, OBO terms, nutrition, observations, Wikidata alignment) MCP server and scion-sdk source adapters"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12, <3.15"
dependencies = [
    "scion-sdk[mcp]>=0.6.2,<0.7.0",
    "httpx>=0.28.1",
]

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.optional-dependencies]
test = ["pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0"]

[project.scripts]
world-reference-mcp = "scion_sdk.cli:serve"

[project.entry-points."scion_sdk.prompt_providers"]
world-reference-mcp = "world_reference_mcp.prompts"

# The one declared connector identity: the fleet name (SCION-CONNECTOR-CONTROL-R071).
[project.entry-points."scion_sdk.connector"]
world-reference-mcp = "world_reference_mcp:connector"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = ["pytest-timeout>=2.4.0", "mypy>=1.20.2", "ruff>=0.16.0"]

[tool.setuptools.package-data]
world_reference_mcp = ["mcp_config.json", "prompts/**", "skills/**", "ontology/**", "connectors/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E501", "B008"]

[tool.setuptools.packages.find]
where = ["."]


[tool.pipelines_hooks]
packages = ["world_reference_mcp"]

[tool.pipelines_hooks.stdout_writes]
served_paths = ["world_reference_mcp"]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

[tool.pipelines.container]
debug_apt = ["default-jre", "ripgrep", "tree", "fd-find", "curl", "nano", "build-essential", "cmake", "libssl-dev", "libcurl4-openssl-dev", "pkg-config", "cargo", "rustc"]
debug_extras = ["test"]

[tool.pipelines.ontology]
ttl = "world_reference"
